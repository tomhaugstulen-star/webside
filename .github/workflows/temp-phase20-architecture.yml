name: Phase20 Architecture Reports

on:
  push:
    branches:
      - feature/phase-20-header-navigation

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run architecture:json
      - run: npm run architecture:diagram
      - uses: actions/upload-artifact@v4
        with:
          name: phase20-architecture-reports
          path: |
            architecture.json
            docs/dependency-graph.mmd
