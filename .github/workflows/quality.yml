name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full verification
        run: npm run verify

      - name: Generate synchronized reports
        run: |
          npm run architecture:json
          npm run architecture:diagram

      - name: Upload synchronization files
        uses: actions/upload-artifact@v4
        with:
          name: phase-25-synchronization
          retention-days: 1
          path: |
            architecture.json
            README.md
            docs/*.md
