name: Temporary architecture reports

on:
  push:
    branches:
      - feature/gradient-fill-before-phase-20

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate architecture reports
        run: |
          npm run architecture:json
          npm run architecture:diagram
      - uses: actions/upload-artifact@v4
        with:
          name: gradient-architecture-reports
          path: |
            architecture.json
            docs/dependency-graph.mmd
